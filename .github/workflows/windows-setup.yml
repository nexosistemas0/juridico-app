name: Windows setup script
on: [push, pull_request]
permissions:
  contents: read
jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/setup-android-windows.ps1 -SelfTest
      - name: Test PowerShell 7
        shell: pwsh
        run: ./scripts/setup-android-windows.ps1 -SelfTest
